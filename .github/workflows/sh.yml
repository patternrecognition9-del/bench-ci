name: sh
run-name: sh ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      cmd: {required: true}
      runner: {default: 'macos-latest'}
      tag: {default: ''}
permissions:
  contents: read
jobs:
  sh:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: cmd
        shell: bash
        env:
          CMD: ${{ inputs.cmd }}
        run: bash -c "$CMD"
